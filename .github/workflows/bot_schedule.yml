name: Run Dovtalab Bot

on:
  schedule:
    # Запуск каждый час (можно изменить, например, '0 * * * *' — каждый час в 0 минут)
    - cron: '0 * * * *' 
  workflow_dispatch: # Позволяет запускать бота вручную кнопкой на сайте GitHub

jobs:
  run-bot:
  runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install python-telegram-bot requests

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python bot.py
